# Training configuration for MQuAKE-ST Single-Answer dataset (n-hop QA)

base_output_dir: "output/mquake_st/"
batch_size: 32
test_batch_size: 128
beta: 0.05
data_input_dir: "datasets/nlq/mquake_st/"
embedding_size: 50
eval_every: 100
gamma: 1.00
hidden_size: 50
Lambda: 0.05
learning_rate: 0.001
max_num_actions: 200
num_rollouts: 20
test_rollouts: 100
total_iterations: 15000
train_entity_embeddings: True
train_relation_embeddings: True
print_predictions: False
question_tokenizer_name: "bert-base-uncased"
use_beam: True
use_entity_embeddings: True
vocab_dir: "${data_input_dir}vocab"

# Recommended variables to tune
seed: 0
use_full_graph: True
use_directed_graph: True
path_length: 4
question_format: "full_text"
evaluate_paraphrases: False
raw_QAData_path: "${data_input_dir}/mquake_sa_qa_nhop.csv"
cached_QAMetaData_path: "./.cache/itl/mquake_sa_qa_nhop.json"
print_paths: True
load_model: False
timestamp: "sa_qa_nhop_reason_${path_length}hop_seed${seed}"

